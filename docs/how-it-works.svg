<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, 'Inter Tight', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5E5850"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C9BFAF"/></marker>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#121110"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" letter-spacing="2.4" fill="#8C8376">
    <text x="48" y="58">WHAT IT READS</text>
    <text x="470" y="58">WHAT IT FINDS INSIDE</text>
    <text x="862" y="58">WHAT IT CHECKS</text>
  </g>
  <!-- sources -->
  <g font-size="15" fill="#EFE6D8">
    <g transform="translate(48 86)"><rect width="330" height="66" rx="10" fill="#1B1917" stroke="#34302B"/><rect width="4" height="66" rx="2" fill="#B89A72"/><text x="22" y="28" font-weight="600">Apps</text><text x="22" y="49" font-size="13" fill="#8C8376" font-family="ui-monospace, Menlo, monospace">Info.plist, frameworks, app.asar</text></g>
    <g transform="translate(48 166)"><rect width="330" height="66" rx="10" fill="#1B1917" stroke="#8C8376"/><rect width="4" height="66" rx="2" fill="#EFE6D8"/><text x="22" y="28" font-weight="600" fill="#EFE6D8">AI models</text><text x="22" y="49" font-size="13" fill="#8C8376" font-family="ui-monospace, Menlo, monospace">GGUF, safetensors and pickle bytes</text></g>
    <g transform="translate(48 246)"><rect width="330" height="66" rx="10" fill="#1B1917" stroke="#34302B"/><rect width="4" height="66" rx="2" fill="#8A8072"/><text x="22" y="28" font-weight="600">Extensions</text><text x="22" y="49" font-size="13" fill="#8C8376" font-family="ui-monospace, Menlo, monospace">manifest.json, package.json</text></g>
    <g transform="translate(48 326)"><rect width="330" height="66" rx="10" fill="#1B1917" stroke="#34302B"/><rect width="4" height="66" rx="2" fill="#5F5950"/><text x="22" y="28" font-weight="600">Packages</text><text x="22" y="49" font-size="13" fill="#8C8376" font-family="ui-monospace, Menlo, monospace">brew, npm and pip, asked directly</text></g>
    <g transform="translate(48 406)"><rect width="330" height="66" rx="10" fill="#1B1917" stroke="#34302B"/><rect width="4" height="66" rx="2" fill="#403B36"/><text x="22" y="28" font-weight="600">Containers</text><text x="22" y="49" font-size="13" fill="#8C8376" font-family="ui-monospace, Menlo, monospace">docker images</text></g>
  </g>
  <!-- middle -->
  <g stroke="#5E5850" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M380 119 C 420 119, 430 170, 466 170"/>
    <path d="M380 279 C 420 279, 430 200, 466 200"/>
    <path d="M380 359 C 420 359, 430 220, 466 220"/>
    <path d="M380 439 C 420 439, 430 240, 466 240"/>
  </g>
  <path d="M380 199 C 420 199, 430 360, 466 360" stroke="#C9BFAF" stroke-opacity=".8" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <g transform="translate(470 140)">
    <rect width="330" height="130" rx="12" fill="#1B1917" stroke="#34302B"/>
    <text x="22" y="36" font-size="17" font-weight="600" fill="#EFE6D8">A parts list</text>
    <text x="22" y="62" font-size="13.5" fill="#C9BFAF">Every library each piece ships with,</text>
    <text x="22" y="82" font-size="13.5" fill="#C9BFAF">and its exact version. Electron apps</text>
    <text x="22" y="102" font-size="13.5" fill="#C9BFAF">list every npm package in app.asar.</text>
  </g>
  <g transform="translate(470 310)">
    <rect width="330" height="130" rx="12" fill="#1B1917" stroke="#8C8376"/>
    <text x="22" y="36" font-size="17" font-weight="600" fill="#EFE6D8">A model report</text>
    <text x="22" y="62" font-size="13.5" fill="#C9BFAF">Architecture, size, precision and</text>
    <text x="22" y="82" font-size="13.5" fill="#C9BFAF">context from the header, and every</text>
    <text x="22" y="102" font-size="13.5" fill="#C9BFAF">import a pickle would perform.</text>
  </g>
  <g stroke="#5E5850" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M802 205 L 858 205"/>
    
  </g>
  <g transform="translate(862 140)">
    <rect width="290" height="130" rx="12" fill="#1B1917" stroke="#34302B"/>
    <text x="22" y="36" font-size="17" font-weight="600" fill="#EFE6D8">OSV.dev</text>
    <text x="22" y="62" font-size="13.5" fill="#C9BFAF">Names and versions only, against</text>
    <text x="22" y="82" font-size="13.5" fill="#C9BFAF">the open database that gathers GitHub's</text>
    <text x="22" y="102" font-size="13.5" fill="#C9BFAF">advisories. Optional, cached.</text>
  </g>
  <path d="M802 375 L 858 375" stroke="#C9BFAF" stroke-opacity=".8" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <g transform="translate(862 310)">
    <rect width="290" height="130" rx="12" fill="#1B1917" stroke="#E0603F" stroke-opacity=".6"/>
    <path d="M258 23 L265 30 L258 37 L251 30 Z" fill="#E0603F"/>
    <text x="22" y="36" font-size="17" font-weight="600" fill="#EFE6D8">Code on load</text>
    <text x="22" y="62" font-size="13.5" fill="#C9BFAF">os.system, eval, subprocess and</text>
    <text x="22" y="82" font-size="13.5" fill="#C9BFAF">the rest, found by walking the</text>
    <text x="22" y="102" font-size="13.5" fill="#C9BFAF">opcodes. Nothing is executed.</text>
  </g>
</svg>
