<!doctype html><html><head><meta charset="utf-8"><title>Assay mock: contact sheet</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,600&family=Inter+Tight:wght@400;500;600&family=Geist+Mono&display=swap");
:root{--ink:#121110;--paper:#1a1816;--bone:#EFE6D8;--bone2:#C9BFAF;--ash:#8C8376;--pencil:#E2543A}
*{box-sizing:border-box}html,body{margin:0;background:var(--ink);color:var(--bone);font:400 15px/1.5 "Inter Tight",system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:56px;padding:36px 44px 60px;max-width:1500px;margin:0 auto}
.sheet{position:relative;background:var(--paper);border-radius:2px;padding:26px 28px 30px;box-shadow:0 1px 0 #ffffff08 inset,0 30px 60px #0008}
.sheet h3{font:500 12.5px "Inter Tight";color:var(--ash);margin:22px 0 10px;display:flex;justify-content:space-between}
.sheet h3:first-child{margin-top:0}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px 8px}
.app{position:relative;display:flex;flex-direction:column;align-items:center}
.app img{width:34px;height:34px;object-fit:contain;filter:saturate(.85)}
.models{display:flex;flex-wrap:wrap;gap:6px 22px;font:400 17px "Spectral",Georgia,serif;color:var(--bone)}
.models span small{font:400 11px "Geist Mono",monospace;color:var(--ash);margin-left:5px}
.type{font:400 10.5px/1.75 "Geist Mono",ui-monospace,monospace;color:#8d857a;text-align:justify;hyphens:none}
.type span{position:relative;white-space:nowrap}
.type span.hit{color:var(--bone)}
.mark{position:absolute;pointer-events:none;overflow:visible}
.num{position:absolute;font:italic 600 15px "Spectral",serif;color:var(--pencil);transform:rotate(-6deg)}
.right h1{font:400 32px/1.25 "Spectral",Georgia,serif;margin:6px 0 28px}
.right h2{font:600 15px "Inter Tight";margin:0 0 12px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid #34302B}
li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:13px 2px;border-bottom:1px solid #221F1C}
li i{font:italic 600 18px "Spectral",serif;color:var(--pencil);transform:rotate(-6deg)}
li b{display:block;font-weight:600}li span{color:var(--bone2);font-size:13.5px}
</style></head><body>
<div class="wrap"><div class="sheet" id="sheet"></div><div class="right" id="right"></div></div>
<script type="module">
const r = await (await fetch("/api/assay")).json();
const sevRank={critical:0,high:1,medium:2,low:3,info:4};
const by=new Map();for(const f of r.findings){if(f.severity==="info")continue;(by.get(f.itemId)??by.set(f.itemId,[]).get(f.itemId)).push(f)}
const worst=fs=>fs.reduce((w,f)=>sevRank[f.severity]<sevRank[w]?f.severity:w,"info");
const flagged=[...by.entries()].map(([id,fs])=>({item:r.items.find(i=>i.id===id),fs,w:worst(fs),code:fs.some(f=>f.kind==="code-on-load"),adv:new Set(fs.map(f=>f.advisory?.id)).size})).filter(x=>x.item)
 .sort((a,b)=>b.code-a.code||sevRank[a.w]-sevRank[b.w]||b.adv-a.adv);
// group packages by environment like the app does
const top=[];const seenEnv=new Set();
for(const x of flagged){const env=x.item.layer==="packages"?(x.item.meta.envLabel||"Homebrew"):null;
 if(env){if(seenEnv.has(env))continue;seenEnv.add(env);const n=flagged.filter(y=>y.item.layer==="packages"&&(y.item.meta.envLabel||"Homebrew")===env).length;
  top.push({key:"env:"+env,name:env,fix:`${n} packages with published advisories.`,ids:flagged.filter(y=>y.item.layer==="packages"&&(y.item.meta.envLabel||"Homebrew")===env).map(y=>y.item.id)})}
 else top.push({key:x.item.id,name:x.item.name,fix:x.code?"Runs code when loaded. Quarantine it.":`Ships ${x.adv} published advisories.`,ids:[x.item.id]})
 if(top.length===5)break}
const markOf=new Map();top.forEach((t,i)=>t.ids.forEach(id=>markOf.set(id,i+1)));
const flaggedIds=new Set(flagged.map(x=>x.item.id));
const L=l=>r.items.filter(i=>i.layer===l);
const S=document.getElementById("sheet");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let h="";
h+=`<h3><span>${L("apps").length} apps</span><span>${L("apps").reduce((a,i)=>a+i.parts.length,0).toLocaleString()} libraries inside</span></h3><div class="apps">`;
for(const a of L("apps").sort((x,y)=>x.name.localeCompare(y.name)))h+=`<div class="app" data-id="${a.id}" title="${esc(a.name)}"><img src="/api/icon?path=${encodeURIComponent(a.path)}" alt=""></div>`;
h+=`</div><h3><span>${L("models").length} AI models</span></h3><div class="models">`;
const P=n=>n>=1e9?(n/1e9).toFixed(n>=1e10?0:1)+"B":n>=1e6?Math.round(n/1e6)+"M":"";
for(const m of L("models"))h+=`<span data-id="${m.id}">${esc(m.name.split("/").pop())}<small>${P(m.model?.parameters||0)}</small></span>`;
h+=`</div><h3><span>${L("extensions").length} extensions, ${L("packages").length} packages, ${L("containers").length} containers</span></h3><div class="type">`;
for(const p of [...L("extensions"),...L("packages"),...L("containers")])h+=`<span data-id="${p.id}" class="${flaggedIds.has(p.id)?"hit":""}">${esc(p.name)}</span> `;
h+=`</div>`;S.innerHTML=h;
await document.fonts.ready;await new Promise(r=>setTimeout(r,300));
// grease pencil: a loose loop around each numbered item, an underline under each package in a flagged install
const rand=(s=>()=>((s=Math.imul(s^(s>>>15),2246822507)>>>0)%1e4)/1e4);
const sb=S.getBoundingClientRect();
const done=new Set();
for(const el of S.querySelectorAll("[data-id]")){const n=markOf.get(el.dataset.id);if(!n)continue;
 const b=el.getBoundingClientRect();const R=rand([...el.dataset.id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7));
 const cx=b.left-sb.left+b.width/2,cy=b.top-sb.top+b.height/2,rx=b.width/2+7,ry=b.height/2+5;
 const env=top[n-1].ids.length>1;
 if(env){const y=b.bottom-sb.top+1;let d=`M${(b.left-sb.left-1).toFixed(1)} ${y}`;const x0=b.left-sb.left,x1=b.right-sb.left;for(let x=x0;x<=x1;x+=3)d+=` L${x.toFixed(1)} ${(y+(R()-.5)*1.4).toFixed(1)}`;
  const u=document.createElementNS("http://www.w3.org/2000/svg","svg");u.classList.add("mark");u.setAttribute("style","left:0;top:0;width:100%;height:100%");u.innerHTML=`<path d="${d}" fill="none" stroke="#E2543A" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>`;S.appendChild(u);
  if(!done.has(n)){done.add(n);const t=document.createElement("span");t.className="num";t.textContent=n;t.style.left=(b.left-sb.left-12)+"px";t.style.top=(b.top-sb.top-12)+"px";S.appendChild(t)}continue}
 const pts=[];const turns=1.12+R()*.1,steps=40,start=R()*6.28;
 for(let k=0;k<=steps;k++){const t=start+k/steps*6.28*turns;const wob=1+(R()-.5)*.08;pts.push([cx+Math.cos(t)*rx*wob,cy+Math.sin(t)*ry*wob])}
 const d="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join(" L");
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.classList.add("mark");svg.setAttribute("style","left:0;top:0;width:100%;height:100%");
 svg.innerHTML=`<path d="${d}" fill="none" stroke="#E2543A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;S.appendChild(svg);
 if(!done.has(n)){done.add(n);const t=document.createElement("span");t.className="num";t.textContent=n;t.style.left=(cx+rx-2)+"px";t.style.top=(cy-ry-16)+"px";S.appendChild(t)}}
const vuln=new Set(flagged.filter(x=>!x.code).map(x=>x.item.id)).size;
document.getElementById("right").innerHTML=`<h1>This Mac runs ${r.items.length.toLocaleString()} pieces of software built from ${r.items.reduce((a,i)=>a+i.parts.length,0).toLocaleString()} libraries. ${vuln} carry a known vulnerability, and one AI model would run code as soon as it’s loaded.</h1>
<h2>Start here</h2><ol>${top.map((t,i)=>`<li><i>${i+1}</i><div><b>${esc(t.name)}</b><span>${esc(t.fix)}</span></div></li>`).join("")}</ol>`;
</script></body></html>
