[package]
name = "assay"
version = "0.1.0"
description = "A bill of materials for your whole Mac"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
ureq = "2"
serde_json = "1"
mac-notification-sys = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
